name: Finalize Midori Meshy ground clump

on:
  push:
    branches:
      - codex/k17-drone-integration
    paths:
      - '.github/workflows/finalize_midori_meshy_ground.yml'
      - '.tmp/meshy_leaf_upload/**'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/k17-drone-integration

      - name: Rebuild uploaded GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/shinrai/parks/midori_park/models/vegetation
          cat .tmp/meshy_leaf_upload/part_*.b64 | base64 --decode > /tmp/midori_meshy_ground.glb.gz
          gzip -dc /tmp/midori_meshy_ground.glb.gz > assets/shinrai/parks/midori_park/models/vegetation/midori_meshy_ground_clump_v1.glb
          test -s assets/shinrai/parks/midori_park/models/vegetation/midori_meshy_ground_clump_v1.glb
          rm -rf .tmp/meshy_leaf_upload
          rm -f .github/workflows/finalize_midori_meshy_ground.yml

      - name: Commit rebuilt asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add optimized Meshy ground clump for Midori Park'
          git push origin HEAD:codex/k17-drone-integration
